server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: shopstack-backend
  datasource:
    url: jdbc:h2:mem:shopstackdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: 9a6f8b1c4e2d7a9b0c3f5e8d1a4b7c0d3e6f9a2b5c8d1e4f7a0b3c6d9e2f5a8b
  expirationMs: 86400000 # 24 hours
